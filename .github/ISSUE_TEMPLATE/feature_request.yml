name: Feature Request
description: Propose a new module, detection, or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New Module
        - Existing Module — new detection
        - Evidence Capture
        - Report Generator
        - AutoAuth
        - Settings / UI
        - Bambda Script
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What gap does this fill? What attack class is currently untested?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Keep it concrete. What should ICARUS do differently?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know it's done? What should a tester be able to do?
    validations:
      required: false
