name: Build

on:
  push:
    branches: [main]
    paths:
      - "icarus-extension/**"
  pull_request:
    branches: [main]
    paths:
      - "icarus-extension/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build extension jar
        working-directory: icarus-extension
        run: bash build.sh

      - name: Verify jar exists
        run: |
          JAR=$(ls icarus-extension/build_manual/libs/icarus-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: no jar found after build"
            exit 1
          fi
          echo "Built: $JAR ($(du -sh "$JAR" | cut -f1))"

      - name: Upload jar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icarus-extension
          path: icarus-extension/build_manual/libs/icarus-*.jar
          retention-days: 30
