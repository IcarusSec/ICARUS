name: Build

on:
  push:
    branches: [main]
    paths:
      - "icarus-extension/**"
  pull_request:
    branches: [main]
    paths:
      - "icarus-extension/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build extension jar
        working-directory: icarus-extension
        run: bash build.sh

      - name: Verify jar exists
        run: |
          JAR=$(ls icarus-extension/build_manual/libs/icarus-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: no jar found after build"
            exit 1
          fi
          echo "Built: $JAR ($(du -sh "$JAR" | cut -f1))"

      - name: Upload jar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icarus-extension
          path: icarus-extension/build_manual/libs/icarus-*.jar
          retention-days: 30
