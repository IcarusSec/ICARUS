name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build fat JAR
        working-directory: icarus-extension
        run: bash build.sh

      - name: Compute SHA-256 checksum
        working-directory: icarus-extension/build_manual/libs
        run: sha256sum icarus-*.jar > icarus-checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          make_latest: "true"
          files: |
            icarus-extension/build_manual/libs/icarus-*.jar
            icarus-extension/build_manual/libs/icarus-checksums.sha256
