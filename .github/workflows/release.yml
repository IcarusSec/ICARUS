name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build fat JAR
        working-directory: icarus-extension
        run: bash build.sh

      - name: Compute SHA-256 checksum
        working-directory: icarus-extension/build_manual/libs
        run: sha256sum icarus-*.jar > icarus-checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            icarus-extension/build_manual/libs/icarus-*.jar
            icarus-extension/build_manual/libs/icarus-checksums.sha256
