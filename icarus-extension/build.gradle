plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

group = 'com.icarus'
version = '1.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(19)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 19
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.6'

    implementation('com.github.librepdf:openpdf:2.0.2') {
        exclude group: 'com.ibm.icu', module: 'icu4j'
    }
    
    implementation 'org.commonmark:commonmark:0.30.0'

    implementation('io.modelcontextprotocol.sdk:mcp-core:1.1.3') {
        exclude group: 'com.networknt', module: 'json-schema-validator'
    }
    implementation('io.modelcontextprotocol.sdk:mcp-json-jackson2:1.1.3') {
        exclude group: 'com.networknt', module: 'json-schema-validator'
    }
    
    implementation 'org.jsoup:jsoup:1.17.2'
}

shadowJar {
    archiveBaseName = 'icarus'
    archiveClassifier = ''
    archiveVersion = project.version
}

tasks.named('build') {
    dependsOn shadowJar
}
