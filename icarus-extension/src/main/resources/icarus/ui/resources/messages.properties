# Report Templates
report.template.title.resumo_executivo=Executive Summary
report.template.content.resumo_executivo=This document consolidates the results of the penetration tests conducted on the component {{team}}/{{component}}, as requested by {{requester}}, performed in the {{environment}} environment by the {{author}} team on {{date}}.\n\nDuring the tests, {{finding_count}} vulnerabilities were identified, classified according to their criticality and potential impact on the evaluated assets. The detected findings include: {{finding_types}}, which are technically detailed in the subsequent sections of this report, along with mitigation and remediation recommendations.\n\nThis report aims to provide technical management and security governance with a clear view of the identified risks, as well as support strategic decisions to strengthen the organization's security posture.
report.template.title.controle_documento=Document Control
report.template.content.controle_documento=### Information Classification: {{classification}}\n\n**{{report_title}}**\n\n* **Project:** {{project}}\n* **Version:** {{version}}\n* **Issue Date:** {{date}}\n* **Author:** {{author}}\n* **Reviewed by:** {{reviewer}}\n* **Approved by:** {{approver}}
report.template.title.historico_revisoes=Revision History
report.template.content.historico_revisoes=* **v0.1** \u2014 Execution of tests and draft consolidation. Author: {{author}}.\n* **v0.2** \u2014 Technical review, false positive triage and retesting. Reviewer: {{reviewer}}.\n* **{{version}}** ({{date}}) \u2014 Issuance and closure of the final version for delivery. Author: {{author}} \u00b7 Approver: {{approver}}.
report.template.title.escopo_avaliacao=Assessment Scope
report.template.content.escopo_avaliacao=* **Address / Hostname / Target:** {{team}}\n* **Component:** {{component}}\n* **Executor:** {{author}}\n* **Requester:** {{requester}}\n* **Responsible:** {{owner}}\n* **Environment:** {{environment}}
report.template.title.usuarios_perfis_acesso=Users and Access Profiles
report.template.content.usuarios_perfis_acesso=* **Unauthenticated** \u2014 Anonymous (Internet). Simulation of an external attacker without privileges.\n* **usr_standard** \u2014 Standard Profile. Validation of horizontal access controls.\n* **usr_admin** \u2014 Administrator. Testing for privilege escalation and access to restricted functions.
report.template.title.matriz_classificacao_cvss4=Classification Matrix (CVSS 4)
report.template.content.matriz_classificacao_cvss4=Based on the results obtained during the evaluation, the risk calculation adopted in this report follows the formula: Criticality (Risk) = (Probability + Impact) / 2.\n\n### Vulnerability (Probability)\n* **Extreme:** The threat origin is highly motivated and sufficiently capable, and the controls applied to prevent the vulnerability are non-existent.\n* **High:** The threat origin is highly motivated and sufficiently capable, and the controls applied to prevent the vulnerability are ineffective.\n* **Medium:** The threat origin is motivated and capable, and the controls applied can partially prevent the exploitation of the vulnerability.\n* **Low:** The threat origin has no motivation or capability, or there are sufficient controls applied or that can sufficiently prevent the vulnerability from being effectively exploited.\n\n### Impact\n* **Extreme:** Exploitation of the vulnerability could result in catastrophic consequences; it could violate, damage, or incalculably impede the organization's mission, reputation or interests.\n* **High:** Exploitation of the vulnerability could result in high costly losses of resources or assets; it could significantly violate, damage, or impede the organization's mission, reputation or interests.\n* **Medium:** Exploitation of the vulnerability could result in possible losses of assets or resources; it could violate, damage, or impede the organization's mission, reputation or interests.\n* **Low:** Exploitation of the vulnerability could result in isolated losses of some assets or resources; it could affect with low consequence the organization's mission, reputation or interests.\n\n### Description of Criticalities and Necessary Actions\n* **Extreme:** Rapid and effective corrective actions must be taken. As defined by standard, the correction time for this type of failure is 15 days.\n* **High:** There is a great need for corrective measures, with an action plan put in place as quickly as possible. As defined by standard, the correction time for this type of failure is 30 days.\n* **Medium:** Corrective actions are necessary, with a plan developed within a reasonable period of time. As defined by standard, the correction time for this type of failure is 90 days.\n* **Low:** The responsible person can establish an action plan in a comfortable time. As defined by standard, the correction time for this type of failure is 180 days.
report.template.title.referencias_tecnicas=Technical References
report.template.content.referencias_tecnicas=* OWASP Top 10 - 2021\n* NIST National Vulnerability Database (NVD)\n* Common Weakness Enumeration (CWE)
