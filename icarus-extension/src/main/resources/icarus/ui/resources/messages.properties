evidence.pdf.risk.impact.desc_alto=Exploitation of the vulnerability could result in high costly losses of resources or assets; it could significantly violate, damage, or impede the organization's mission, reputation or interests.
evidence.pdf.risk.impact.desc_medio=Exploitation of the vulnerability could result in possible losses of assets or resources; it could violate, damage, or impede the organization's mission, reputation or interests.
evidence.pdf.risk.impact.desc_baixo=Exploitation of the vulnerability could result in isolated losses of some assets or resources; it could affect with low consequence the organization's mission, reputation or interests.
evidence.pdf.risk.impact.caption=Table 6 \u2013 Impact definitions
evidence.pdf.risk.criticality.title=Description of Criticalities and Necessary Actions
evidence.pdf.risk.criticality.desc_extremo=If the risk is considered extreme, rapid and effective corrective actions must be taken. As defined by standard, the correction time for this type of failure is 15 days.
evidence.pdf.risk.criticality.desc_alto=If the risk is considered high, there is a great need for corrective measures. A corrective action plan should be put in place as quickly as possible. As defined by standard, the correction time for this type of failure is 30 days.
evidence.pdf.risk.criticality.desc_medio=If the risk is considered medium, corrective actions are necessary and a plan must be developed to incorporate these actions within a reasonable period of time. As defined by standard, the correction time for this type of failure is 90 days.
evidence.pdf.risk.criticality.desc_baixo=If a risk is considered low, the person in charge can establish an action plan in a comfortable time. As defined by standard, the correction time for this type of failure is 180 days.
evidence.pdf.risk.criticality.caption=Table 7 \u2013 Criticality criteria and correction deadlines
