evidence.pdf.risk.intro=Com base nos resultados obtidos durante a avalia\u00e7\u00e3o, iniciamos a an\u00e1lise dos riscos identificados. O c\u00e1lculo de risco adotado neste relat\u00f3rio segue a f\u00f3rmula: Criticidade (Risco) = (Probabilidade + Impacto) / 2.
evidence.pdf.risk.probability.title=Vulnerabilidade (Probabilidade)
evidence.pdf.risk.probability.desc_extremo=A amea\u00e7a origem \u00e9 altamente motivada e suficientemente capaz, e os controles aplicados para prevenir a vulnerabilidade s\u00e3o inexistentes.
evidence.pdf.risk.probability.desc_alto=A amea\u00e7a origem \u00e9 altamente motivada e suficientemente capaz, e os controles aplicados para prevenir a vulnerabilidade s\u00e3o ineficazes.
evidence.pdf.risk.probability.desc_medio=A amea\u00e7a origem \u00e9 motivada e capaz, e os controles aplicados podem prevenir parcialmente a explora\u00e7\u00e3o da vulnerabilidade.
evidence.pdf.risk.probability.desc_baixo=A amea\u00e7a origem n\u00e3o tem motiva\u00e7\u00e3o ou capacidade, ou h\u00e1 controles suficientes aplicados ou que possam suficientemente impedir que a vulnerabilidade seja explorada de maneira efetiva.
evidence.pdf.risk.probability.caption=Tabela 5 \u2013 Defini\u00e7\u00f5es de probabilidade
evidence.pdf.risk.impact.title=Impacto
evidence.pdf.risk.impact.desc_extremo=A explora\u00e7\u00e3o da vulnerabilidade pode resultar em consequ\u00eancias catastr\u00f3ficas; podendo violar, danificar, ou impedir de forma incalcul\u00e1vel a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.
evidence.pdf.risk.impact.desc_alto=A explora\u00e7\u00e3o da vulnerabilidade pode resultar em altas perdas dispendiosas em recursos ou ativos; pode violar, danificar, ou impedir de forma significativa a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.
evidence.pdf.risk.impact.desc_medio=A explora\u00e7\u00e3o da vulnerabilidade pode resultar em poss\u00edveis perdas de ativos ou recursos; pode violar, danificar, ou impedir a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.
evidence.pdf.risk.impact.desc_baixo=A explora\u00e7\u00e3o da vulnerabilidade pode resultar em perdas pontuais de alguns ativos ou recursos; pode afetar com baixa consequ\u00eancia a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.
evidence.pdf.risk.impact.caption=Tabela 6 \u2013 Defini\u00e7\u00f5es de impacto
evidence.pdf.risk.criticality.title=Descri\u00e7\u00e3o das Criticidades e A\u00e7\u00f5es Necess\u00e1rias
evidence.pdf.risk.criticality.desc_extremo=Se o risco for considerado extremo, a\u00e7\u00f5es r\u00e1pidas e efetivas para corre\u00e7\u00e3o devem ser tomadas. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 15 dias.
evidence.pdf.risk.criticality.desc_alto=Se o risco for considerado alto, h\u00e1 uma grande necessidade de medidas corretivas. Um plano de a\u00e7\u00e3o corretiva dever\u00e1 ser colocado em pr\u00e1tica o mais r\u00e1pido poss\u00edvel. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 30 dias.
evidence.pdf.risk.criticality.desc_medio=Se o risco for considerado m\u00e9dio, a\u00e7\u00f5es corretivas s\u00e3o necess\u00e1rias e um plano deve ser desenvolvido para incorporar estas a\u00e7\u00f5es dentro de um per\u00edodo razo\u00e1vel de tempo. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 90 dias.
evidence.pdf.risk.criticality.desc_baixo=Se um risco for considerado baixo, o respons\u00e1vel poder\u00e1 estabelecer um plano de a\u00e7\u00e3o em um tempo confort\u00e1vel. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 180 dias.
evidence.pdf.risk.criticality.caption=Tabela 7 \u2013 Crit\u00e9rios de criticidade e prazos de corre\u00e7\u00e3o
evidence.pdf.risk_levels.extreme=Extremo
evidence.pdf.risk_levels.high=Alto
