# Report Templates
report.template.title.resumo_executivo=Resumo Executivo
report.template.content.resumo_executivo=O presente documento consolida os resultados dos testes de intrus\u00e3o conduzidos no componente {{eht}}/{{componente}}, conforme solicita\u00e7\u00e3o de {{solicitante}}, realizados no ambiente {{ambiente}} pela equipe de {{autor}} em {{data}}.\n\nDurante a execu\u00e7\u00e3o dos testes, foram identificadas {{quantidade_findings}} vulnerabilidades, classificadas conforme sua criticidade e impacto potencial nos ativos avaliados. As findings detectadas incluem: {{lista_findings}}, as quais s\u00e3o detalhadas tecnicamente nas se\u00e7\u00f5es subsequentes deste relat\u00f3rio, acompanhadas de recomenda\u00e7\u00f5es de mitiga\u00e7\u00e3o e corre\u00e7\u00e3o.\n\nEste relat\u00f3rio tem como objetivo fornecer \u00e0 dire\u00e7\u00e3o t\u00e9cnica e \u00e0 governan\u00e7a de seguran\u00e7a uma vis\u00e3o clara dos riscos identificados, bem como subsidiar decis\u00f5es estrat\u00e9gicas para o fortalecimento da postura de seguran\u00e7a da organiza\u00e7\u00e3o.
report.template.title.controle_documento=Controle de Documento
report.template.content.controle_documento=### Classifica\u00e7\u00e3o da Informa\u00e7\u00e3o: {{classificacao}}\n\n**{{titulo_relatorio}}**\n\n* **Projeto:** {{projeto}}\n* **Vers\u00e3o:** {{versao}}\n* **Data de Emiss\u00e3o:** {{data}}\n* **Autor:** {{autor}}\n* **Revisado por:** {{revisor}}\n* **Aprovado por:** {{aprovador}}
report.template.title.historico_revisoes=Hist\u00f3rico de Revis\u00f5es
report.template.content.historico_revisoes=* **v0.1** \u2014 Execu\u00e7\u00e3o dos testes e consolida\u00e7\u00e3o do rascunho. Autor: {{autor}}.\n* **v0.2** \u2014 Revis\u00e3o t\u00e9cnica, triagem de falsos positivos e retestes. Revisor: {{revisor}}.\n* **{{versao}}** ({{data}}) \u2014 Emiss\u00e3o e fechamento da vers\u00e3o final para entrega. Autor: {{autor}} \u00b7 Aprovador: {{aprovador}}.
report.template.title.escopo_avaliacao=Escopo da Avalia\u00e7\u00e3o
report.template.content.escopo_avaliacao=* **[REDACTED] (Endere\u00e7o/Hostname/Target):** {{eht}}\n* **Componente:** {{componente}}\n* **Executor:** {{executor}}\n* **Solicitante:** {{solicitante}}\n* **Respons\u00e1vel:** {{responsavel}}\n* **Ambiente:** {{ambiente}}
report.template.title.usuarios_perfis_acesso=Usu\u00e1rios e Perfis de Acesso
report.template.content.usuarios_perfis_acesso=* **N\u00e3o autenticado** \u2014 An\u00f4nimo (Internet). Simula\u00e7\u00e3o de atacante externo sem privil\u00e9gios.\n* **usr_standard** \u2014 Perfil Padr\u00e3o. Valida\u00e7\u00e3o de controles de acesso horizontais.\n* **usr_admin** \u2014 Administrador. Teste de escalada de privil\u00e9gios e acesso a fun\u00e7\u00f5es restritas.
report.template.title.matriz_classificacao_cvss4=Matriz de Classifica\u00e7\u00e3o (CVSS 4)
report.template.content.matriz_classificacao_cvss4=Com base nos resultados obtidos durante a avalia\u00e7\u00e3o, o c\u00e1lculo de risco adotado neste relat\u00f3rio segue a f\u00f3rmula: Criticidade (Risco) = (Probabilidade + Impacto) / 2.\n\n### Vulnerabilidade (Probabilidade)\n* **Extremo:** A amea\u00e7a origem \u00e9 altamente motivada e suficientemente capaz, e os controles aplicados para prevenir a vulnerabilidade s\u00e3o inexistentes.\n* **Alto:** A amea\u00e7a origem \u00e9 altamente motivada e suficientemente capaz, e os controles aplicados para prevenir a vulnerabilidade s\u00e3o ineficazes.\n* **M\u00e9dio:** A amea\u00e7a origem \u00e9 motivada e capaz, e os controles aplicados podem prevenir parcialmente a explora\u00e7\u00e3o da vulnerabilidade.\n* **Baixo:** A amea\u00e7a origem n\u00e3o tem motiva\u00e7\u00e3o ou capacidade, ou h\u00e1 controles suficientes aplicados ou que possam suficientemente impedir que a vulnerabilidade seja explorada de maneira efetiva.\n\n### Impacto\n* **Extremo:** A explora\u00e7\u00e3o da vulnerabilidade pode resultar em consequ\u00eancias catastr\u00f3ficas; podendo violar, danificar, ou impedir de forma incalcul\u00e1vel a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.\n* **Alto:** A explora\u00e7\u00e3o da vulnerabilidade pode resultar em altas perdas dispendiosas em recursos ou ativos; pode violar, danificar, ou impedir de forma significativa a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.\n* **M\u00e9dio:** A explora\u00e7\u00e3o da vulnerabilidade pode resultar em poss\u00edveis perdas de ativos ou recursos; pode violar, danificar, ou impedir a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.\n* **Baixo:** A explora\u00e7\u00e3o da vulnerabilidade pode resultar em perdas pontuais de alguns ativos ou recursos; pode afetar com baixa consequ\u00eancia a miss\u00e3o, reputa\u00e7\u00e3o ou interesses da organiza\u00e7\u00e3o.\n\n### Descri\u00e7\u00e3o das Criticidades e A\u00e7\u00f5es Necess\u00e1rias\n* **Extremo:** A\u00e7\u00f5es r\u00e1pidas e efetivas para corre\u00e7\u00e3o devem ser tomadas. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 15 dias.\n* **Alto:** H\u00e1 uma grande necessidade de medidas corretivas, com plano de a\u00e7\u00e3o colocado em pr\u00e1tica o mais r\u00e1pido poss\u00edvel. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 30 dias.\n* **M\u00e9dio:** A\u00e7\u00f5es corretivas s\u00e3o necess\u00e1rias, com um plano desenvolvido dentro de um per\u00edodo razo\u00e1vel de tempo. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 90 dias.\n* **Baixo:** O respons\u00e1vel poder\u00e1 estabelecer um plano de a\u00e7\u00e3o em um tempo confort\u00e1vel. Conforme definido em norma, o tempo de corre\u00e7\u00e3o para este tipo de falha \u00e9 de 180 dias.
